name: Daily Crypto News

on:
  schedule:
    # 12:00 AM CT / midnight (CDT) = 05:00 UTC — moved 7h earlier to give the
    # heavier "veryslow" x264 preset + full-fps render (max quality, see
    # src/video/compositor.py) plenty of runway before GitHub's 6h hard cap
    # on hosted-runner job execution time. (daily_pipeline.yml used to also
    # run on its own schedule an hour after this one — its cron is now
    # disabled since it duplicated this pipeline with stale/incomplete config.)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Number of clips to generate (default 7)
        default: '7'
        required: false
      topic:
        description: Optional topic override (leave blank for auto)
        default: ''
        required: false
      manifest:
        description: JSON array of pre-selected stories from the cloud curator (leave blank for auto-discovery)
        default: ''
        required: false
      skip_buffer:
        description: Set to "true" to skip Buffer scheduling (test/diagnostic runs)
        default: 'false'
        required: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # 360 = GitHub's hard ceiling for hosted-runner jobs; setting it any
    # higher has no effect, GitHub kills the job at 6h regardless.
    timeout-minutes: 360

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── System deps + yt-dlp binary ───────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg python3-dev libgl1 libglib2.0-0 \
            libsndfile1 fonts-liberation fonts-open-sans unzip
          # yt-dlp binary (latest)
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp && sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version
          # Deno — yt-dlp uses it to solve YouTube JS challenges
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          # yt-dlp config: sleep/retry flags + android,web_creator (no cookies needed)
          mkdir -p ~/.config/yt-dlp
          printf '%s\n' \
            '--no-check-certificate' \
            '--sleep-requests 2' \
            '--sleep-interval 3' \
            '--max-sleep-interval 8' \
            '--retries 5' \
            '--retry-sleep 15' \
            '--extractor-args youtube:player_client=mweb,web' \

            > ~/.config/yt-dlp/config
          echo "yt-dlp config:"; cat ~/.config/yt-dlp/config

      # ── Python ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install opencv-python-headless webvtt-py

      # ── Montserrat / Anton fonts ──────────────────────────────────────────
      - name: Install fonts
        run: |
          mkdir -p assets/fonts/Montserrat assets/fonts/Anton
          wget -q "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf" \
            -O assets/fonts/Montserrat/Montserrat-Bold.ttf
          wget -q "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Black.ttf" \
            -O assets/fonts/Montserrat/Montserrat-Black.ttf
          wget -q "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-SemiBold.ttf" \
            -O assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          wget -q "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf" \
            -O assets/fonts/Anton/Anton-Regular.ttf

      # ── Persist SQLite DB between runs (dedup memory) ────────────────────
      - name: Restore dedup database
        uses: actions/cache@v4
        with:
          path: data/news_shorts.db
          key: dedup-db-${{ github.run_number }}
          restore-keys: dedup-db-

      - name: Ensure data dir exists
        run: mkdir -p data output

      # ── Run pipeline ──────────────────────────────────────────────────────
      - name: Generate clips and schedule to Buffer
        env:
          OPENAI_API_KEY:           placeholder
          NEWSDATA_API_KEY:         ${{ secrets.NEWSDATA_API_KEY }}
          YOUTUBE_API_KEY:          ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES_B64:      ${{ secrets.YOUTUBE_COOKIES_B64 }}
          ORACLE_PROXY_URL:         ${{ secrets.ORACLE_PROXY_URL }}
          ORACLE_PROXY_SECRET:      ${{ secrets.ORACLE_PROXY_SECRET }}
          YOUTUBE_BROLL_ONLY:       "true"
          NVIDIA_API_KEY_1:         ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2:         ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3:         ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4:         ${{ secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5:         ${{ secrets.NVIDIA_API_KEY_5 }}
          NVIDIA_OSS_KEY_1:         ${{ secrets.NVIDIA_OSS_KEY_1 }}
          NVIDIA_OSS_KEY_2:         ${{ secrets.NVIDIA_OSS_KEY_2 }}
          NVIDIA_OSS_KEY_3:         ${{ secrets.NVIDIA_OSS_KEY_3 }}
          NVIDIA_OSS_KEY_4:         ${{ secrets.NVIDIA_OSS_KEY_4 }}
          NVIDIA_OSS_KEY_5:         ${{ secrets.NVIDIA_OSS_KEY_5 }}
          NVIDIA_OSS_KEY_6:         ${{ secrets.NVIDIA_OSS_KEY_6 }}
          NVIDIA_OSS_KEY_7:         ${{ secrets.NVIDIA_OSS_KEY_7 }}
          NVIDIA_OSS_KEY_8:         ${{ secrets.NVIDIA_OSS_KEY_8 }}
          NVIDIA_OSS_KEY_9:         ${{ secrets.NVIDIA_OSS_KEY_9 }}
          NVIDIA_OSS_KEY_10:        ${{ secrets.NVIDIA_OSS_KEY_10 }}
          NVIDIA_GLM_KEY_1:         ${{ secrets.NVIDIA_GLM_KEY_1 }}
          NVIDIA_GLM_KEY_2:         ${{ secrets.NVIDIA_GLM_KEY_2 }}
          NVIDIA_GLM_KEY_3:         ${{ secrets.NVIDIA_GLM_KEY_3 }}
          NVIDIA_GLM_KEY_4:         ${{ secrets.NVIDIA_GLM_KEY_4 }}
          NVIDIA_GLM_KEY_5:         ${{ secrets.NVIDIA_GLM_KEY_5 }}
          NVIDIA_GLM_KEY_6:         ${{ secrets.NVIDIA_GLM_KEY_6 }}
          GROQ_API_KEY_1:           ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2:           ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:           ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4:           ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5:           ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6:           ${{ secrets.GROQ_API_KEY_6 }}
          BUFFER_API_KEY:           ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS:       ${{ secrets.BUFFER_CHANNEL_IDS }}
          ZERNIO_API_KEY:           ${{ secrets.ZERNIO_API_KEY }}
          ELEVENLABS_API_KEY:       ${{ secrets.ELEVENLABS_API_KEY }}
          DISCORD_WEBHOOK_URL:      ${{ secrets.DISCORD_WEBHOOK_URL }}
          STORAGE_REPO:             panavm12-jpg/storage
          STORAGE_BRANCH:           main
          STORAGE_TOKEN:            ${{ secrets.STORAGE_TOKEN }}
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          # Pass workflow_dispatch inputs as env vars — never interpolate raw JSON into
          # the shell script body, because apostrophes in story titles break bash quoting.
          _COUNT_INPUT:             ${{ github.event.inputs.count }}
          _TOPIC_INPUT:             ${{ github.event.inputs.topic }}
          _MANIFEST_INPUT:          ${{ github.event.inputs.manifest }}
          _SKIP_BUFFER_INPUT:       ${{ github.event.inputs.skip_buffer }}
        run: |
          COUNT="${_COUNT_INPUT:-7}"
          TOPIC="$_TOPIC_INPUT"
          MANIFEST="$_MANIFEST_INPUT"
          EXTRA=""
          if [ "$_SKIP_BUFFER_INPUT" = "true" ]; then
            EXTRA="--skip-buffer"
          fi
          if [ -n "$MANIFEST" ]; then
            python run_daily.py --count "$COUNT" --manifest "$MANIFEST" $EXTRA
          elif [ -n "$TOPIC" ]; then
            python run_daily.py --count "$COUNT" --topic "$TOPIC" $EXTRA
          else
            python run_daily.py --count "$COUNT" $EXTRA
          fi

      # ── Upload run artifacts (for debugging) ─────────────────────────────
      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-output-${{ github.run_number }}
          path: output/
          retention-days: 7
