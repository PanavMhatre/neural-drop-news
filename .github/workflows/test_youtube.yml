name: Test YouTube Download

on:
  workflow_dispatch:
  push:
    paths:
      - 'test_youtube.py'
      - '.github/workflows/test_youtube.yml'

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp binary, ffmpeg, and Deno
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg unzip
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          yt-dlp --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps and yt-dlp PO token provider
        run: |
          pip install requests yt-dlp bgutil-ytdlp-pot-provider
          # Download the bgutil server scripts required by the PO token provider
          BGUTIL_VERSION=$(pip show bgutil-ytdlp-pot-provider | grep ^Version | awk '{print $2}')
          mkdir -p ~/bgutil-ytdlp-pot-provider
          curl -L "https://github.com/coletdjnz/yt-dlp-get-pot/releases/latest/download/bgutil-ytdlp-pot-provider-${BGUTIL_VERSION}.zip" \
            -o /tmp/bgutil.zip 2>/dev/null || \
          curl -L "https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/latest/download/bgutil-ytdlp-pot-provider.zip" \
            -o /tmp/bgutil.zip 2>/dev/null || \
          curl -L "https://github.com/Brainicism/bgutil-ytdlp-pot-provider/archive/refs/heads/master.zip" \
            -o /tmp/bgutil.zip
          unzip -q /tmp/bgutil.zip -d /tmp/bgutil-extracted
          # Find and copy the server directory
          SERVER_DIR=$(find /tmp/bgutil-extracted -name "generate_once.ts" -type f | head -1 | xargs dirname | xargs dirname 2>/dev/null)
          if [ -n "$SERVER_DIR" ]; then
            cp -r "$SERVER_DIR" ~/bgutil-ytdlp-pot-provider/server
            echo "bgutil server scripts installed at ~/bgutil-ytdlp-pot-provider/server"
            ls ~/bgutil-ytdlp-pot-provider/server/
          else
            echo "WARNING: Could not find bgutil server scripts"
          fi

      - name: Write yt-dlp cookies
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          mkdir -p ~/.config/yt-dlp
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > ~/.config/yt-dlp/cookies.txt
            echo "Cookies written ($(wc -l < ~/.config/yt-dlp/cookies.txt) lines)."
          else
            echo "ERROR: No YTDLP_COOKIES secret"
            exit 1
          fi

      - name: Write yt-dlp config
        run: |
          python3 - << 'PYEOF'
          import os
          from pathlib import Path

          config_dir = Path.home() / ".config/yt-dlp"
          config_dir.mkdir(parents=True, exist_ok=True)
          cookies = config_dir / "cookies.txt"

          lines = [
              "--sleep-requests 2",
              "--sleep-interval 3",
              "--max-sleep-interval 8",
              "--retries 5",
          ]
          if cookies.exists():
              lines.append(f"--cookies {cookies}")
              print(f"Cookies found: {cookies} ({cookies.stat().st_size} bytes)")

          config_path = config_dir / "config"
          config_path.write_text("\n".join(lines) + "\n")
          print(f"Config written to {config_path}:")
          print(config_path.read_text())
          PYEOF

      - name: Test YouTube download
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python test_youtube.py
