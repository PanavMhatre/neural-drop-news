name: Test YouTube Download

on:
  workflow_dispatch:

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install yt-dlp and requests
        run: pip install yt-dlp requests

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Write yt-dlp cookies
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          mkdir -p ~/.config/yt-dlp
          echo "$YTDLP_COOKIES" > ~/.config/yt-dlp/cookies.txt
          echo "Cookie lines: $(wc -l < ~/.config/yt-dlp/cookies.txt)"

      - name: Test YouTube download
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES_FILE: ${{ env.HOME }}/.config/yt-dlp/cookies.txt
        run: python test_youtube.py
