name: Test YouTube Download

on:
  workflow_dispatch:

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install yt-dlp and requests
        run: pip install yt-dlp requests

      - name: Write YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          echo "Cookie file size: $(wc -c < /tmp/yt_cookies.txt) bytes"
          echo "Cookie file lines: $(wc -l < /tmp/yt_cookies.txt)"
          head -3 /tmp/yt_cookies.txt

      - name: Test YouTube download
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python test_youtube.py
