name: Test YouTube Download

on:
  workflow_dispatch:
  push:
    paths:
      - 'test_youtube.py'
      - '.github/workflows/test_youtube.yml'

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp binary and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp && sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version
          mkdir -p ~/.config/yt-dlp
          printf '%s\n' '--no-check-certificate' '--socket-timeout 15' '--retries 3' > ~/.config/yt-dlp/config
          echo "Config written:"; cat ~/.config/yt-dlp/config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Test YouTube download
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python test_youtube.py
