services:
  - type: web
    name: neural-drop-news
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: BUFFER_API_KEY
        sync: false
      - key: BUFFER_CHANNEL_IDS
        sync: false
      - key: ZERNIO_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: CRYPTOPANIC_API_KEY
        sync: false
